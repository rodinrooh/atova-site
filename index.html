<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atova</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #fafafa;
      color: #16181c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #55595f;
      margin: 0 0 28px;
    }
    nav {
      font-size: 15px;
      margin-bottom: 40px;
    }
    nav a {
      color: #16181c;
      text-decoration: none;
      border-bottom: 1px solid rgba(22,24,28,0.25);
    }
    nav a:hover { border-bottom-color: currentColor; }
    nav span {
      color: #b5b9c0;
      margin: 0 10px;
    }
    footer {
      font-size: 13.5px;
      color: #8a8f97;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Atova</h1>
    <p>Atova builds software products and apps.</p>
    <nav>
      <a href="/snoretracker/privacy">Privacy Policy</a>
      <span>·</span>
      <a href="/snoretracker/terms">Terms of Use</a>
    </nav>
    <footer>Contact: <a href="mailto:team@atova.co">team@atova.co</a></footer>
  </main>
</body>
</html>
